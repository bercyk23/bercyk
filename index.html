<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wspólny Kalendarz Treningowy</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #bb86fc;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --michal-color: #03dac6;
            --klaudia-color: #ff79c6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1000px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        h1, h2, h3, h4 {
            margin: 0;
            color: var(--accent-color);
        }
        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-danger {
            background-color: #cf6679;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 768px) {
            .dashboard {
                grid-template-columns: 2fr 1fr;
            }
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }
        .weekday {
            font-weight: bold;
            color: var(--text-muted);
            padding: 5px 0;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        .day {
            background-color: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            cursor: pointer;
            border-radius: 4px;
            position: relative;
            font-size: 0.9rem;
        }
        .day:hover {
            background-color: rgba(187, 134, 252, 0.1);
        }
        .day.today {
            border: 2px solid var(--accent-color);
        }
        .day.selected {
            background-color: rgba(187, 134, 252, 0.2);
        }
        .day.has-michal {
            border-color: var(--michal-color);
            background-color: rgba(3, 218, 198, 0.05);
        }
        .day.has-klaudia {
            border-color: var(--klaudia-color);
            background-color: rgba(255, 121, 198, 0.05);
        }
        .day.has-both {
            border-color: var(--accent-color);
            background-color: rgba(187, 134, 252, 0.1);
        }
        .day-number {
            align-self: flex-start;
        }
        .indicators-container {
            display: flex;
            gap: 3px;
            align-self: flex-end;
        }
        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .ind-michal { background-color: var(--michal-color); }
        .ind-klaudia { background-color: var(--klaudia-color); }
        
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            padding: 8px;
            background-color: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 4px;
            box-sizing: border-box;
        }
        .training-list {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        .training-item {
            background-color: rgba(255,255,255,0.05);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 0 4px 4px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-michal { border-left: 4px solid var(--michal-color); }
        .item-klaudia { border-left: 4px solid var(--klaudia-color); }
        
        .training-info h4 { margin: 0 0 3px 0; }
        .training-info p { margin: 0; font-size: 0.85rem; color: var(--text-muted); }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .stat-box {
            background-color: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            font-size: 0.85rem;
        }
        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 3px;
        }
        #sync-status {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Wspólny Kalendarz</h1>
            <span id="sync-status">Łączenie...</span>
        </div>
        <button id="btn-refresh" style="padding: 5px 10px; font-size: 0.8rem;">Odśwież</button>
    </header>

    <div class="dashboard">
        <div class="card">
            <div class="calendar-controls">
                <button id="btn-prev">&lt;</button>
                <h2 id="calendar-month-year">Miesiąc Rok</h2>
                <button id="btn-next">&gt;</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="card">
                <h3>Treningi w dniu:</h3>
                <p id="selected-date-str" style="color: var(--text-muted); margin: 5px 0 15px 0; font-size: 0.9rem;"></p>
                
                <div class="training-list" id="day-trainings-list"></div>

                <hr style="border-color: var(--border-color); margin: 15px 0;">
                
                <h4>Dodaj nowy trening</h4>
                <form id="training-form" style="margin-top: 10px;">
                    <div class="form-group">
                        <label for="input-user">Kto trenował?</label>
                        <select id="input-user" required>
                            <option value="Michał">Michał ♂</option>
                            <option value="Klaudia">Klaudia ♀</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="input-type">Rodzaj aktywności</label>
                        <select id="input-type" required>
                            <option value="Bieganie (Bieżnia)">Bieganie (Bieżnia)</option>
                            <option value="Bieganie (Teren)">Bieganie (Teren)</option>
                            <option value="Rower">Rower</option>
                            <option value="Siłownia">Siłownia</option>
                            <option value="Inny">Inny</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="input-duration">Czas trwania (minuty)</label>
                        <input type="number" id="input-duration" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="input-distance">Dystans (km)</label>
                        <input type="number" id="input-distance" min="0" step="0.01" placeholder="opcjonalnie">
                    </div>
                    <button type="submit" style="width: 100%;">Zapisz</button>
                </form>
            </div>

            <div class="card">
                <h3 style="color: var(--michal-color);">Statystyki - Michał</h3>
                <div class="stats-grid">
                    <div class="stat-box"><div>Treningi</div><div class="stat-value" id="michal-count" style="color: var(--michal-color);">0</div></div>
                    <div class="stat-box"><div>Czas</div><div class="stat-value" id="michal-time" style="color: var(--michal-color);">0h</div></div>
                    <div class="stat-box" style="grid-column: span 2;"><div>Dystans łączny</div><div class="stat-value" id="michal-dist" style="color: var(--michal-color);">0 km</div></div>
                </div>

                <h3 style="color: var(--klaudia-color);">Statystyki - Klaudia</h3>
                <div class="stats-grid">
                    <div class="stat-box"><div>Treningi</div><div class="stat-value" id="klaudia-count" style="color: var(--klaudia-color);">0</div></div>
                    <div class="stat-box"><div>Czas</div><div class="stat-value" id="klaudia-time" style="color: var(--klaudia-color);">0h</div></div>
                    <div class="stat-box" style="grid-column: span 2;"><div>Dystans łączny</div><div class="stat-value" id="klaudia-dist" style="color: var(--klaudia-color);">0 km</div></div>
                </div>

                <h3 style="margin-top: 15px;">Stan Oleju w Bieżni 🏃‍♂️</h3>
                <div class="stats-grid">
                    <div class="stat-box" style="grid-column: span 2;">
                        <div>Czas pracy od smarowania</div>
                        <div class="stat-value" id="treadmill-hours">0 / 30 h</div>
                        <div style="font-size: 0.8rem; margin-top: 5px;" id="treadmill-status">Sprawdzanie...</div>
                        <button id="btn-reset-treadmill" style="margin-top: 10px; font-size: 0.8rem; padding: 5px 10px;" class="btn-danger">Resetuj licznik oleju</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://ytkl2rm-1w0muzwcy252za.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ytkl2Rm-1W0mUZwCY252zA_xO3ukIFJ';
    const API_URL = `${SUPABASE_URL}/rest/v1/kalendarz?id=eq.wspolny`;

    let currentDate = new Date();
    let selectedDate = new Date();
    
    let mainDatabase = {
        trainings: [],
        treadmillHours: 0
    };

    const weekdays = ['Pon', 'Wt', 'Śr', 'Czw', 'Pt', 'Sob', 'Nd'];
    const months = ['Styczeń', 'Luty', 'Marzec', 'Kwiecień', 'Maj', 'Czerwiec', 'Lipiec', 'Sierpień', 'Wrzesień', 'Październik', 'Listopad', 'Grudzień'];

    async function loadData() {
        document.getElementById('sync-status').innerText = "Odświeżanie...";
        try {
            const response = await fetch(API_URL, {
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`
                }
            });
            if (response.ok) {
                const data = await response.json();
                if (data && data.length > 0) {
                    mainDatabase = data[0].dane;
                }
                document.getElementById('sync-status').innerText = "Zsynchronizowano";
            }
        } catch (e) {
            document.getElementById('sync-status').innerText = "Błąd połączenia";
        }
        renderCalendar();
        renderStats();
    }

    async function saveData() {
        try {
            await fetch(API_URL, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify({ dane: mainDatabase })
            });
            document.getElementById('sync-status').innerText = "Zapisano";
        } catch (e) {
            console.error(e);
        }
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        document.getElementById('calendar-month-year').innerText = `${months[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
        
        weekdays.forEach(day => {
            const div = document.createElement('div');
            div.className = 'weekday';
            div.innerText = day;
            grid.appendChild(div);
        });

        const firstDayIndex = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();
        const adjFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
        const totalDays = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();

        for (let i = 0; i < adjFirstDay; i++) {
            grid.appendChild(document.createElement('div'));
        }

        for (let d = 1; d <= totalDays; d++) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'day';
            
            const thisDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), d);
            const dateStr = formatDateLocal(thisDate);
            
            if (dateStr === formatDateLocal(new Date())) dayDiv.classList.add('today');
            if (dateStr === formatDateLocal(selectedDate)) dayDiv.classList.add('selected');
            
            const daysTrainings = (mainDatabase.trainings || []).filter(t => t.date === dateStr);
            const hasMichal = daysTrainings.some(t => t.user === 'Michał');
            const hasKlaudia = daysTrainings.some(t => t.user === 'Klaudia');

            if (hasMichal && hasKlaudia) dayDiv.classList.add('has-both');
            else if (hasMichal) dayDiv.classList.add('has-michal');
            else if (hasKlaudia) dayDiv.classList.add('has-klaudia');

            dayDiv.innerHTML = `<span class="day-number">${d}</span>`;
            
            if (daysTrainings.length > 0) {
                let indHtml = '<div class="indicators-container">';
                if (hasMichal) indHtml += '<div class="indicator ind-michal"></div>';
                if (hasKlaudia) indHtml += '<div class="indicator ind-klaudia"></div>';
                indHtml += '</div>';
                dayDiv.innerHTML += indHtml;
            }

            dayDiv.addEventListener('click', () => {
                selectedDate = thisDate;
                document.querySelectorAll('.day').forEach(el => el.classList.remove('selected'));
                dayDiv.classList.add('selected');
                updateEditorPanel();
            });

            grid.appendChild(dayDiv);
        }
        updateEditorPanel();
    }

    function formatDateLocal(date) {
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }

    function updateEditorPanel() {
        const dateStr = formatDateLocal(selectedDate);
        document.getElementById('selected-date-str').innerText = selectedDate.toLocaleDateString('pl-PL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        
        const listContainer = document.getElementById('day-trainings-list');
        listContainer.innerHTML = '';
        
        const daysTrainings = (mainDatabase.trainings || []).filter(t => t.date === dateStr);
        
        if (daysTrainings.length === 0) {
            listContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem; margin:0;">Brak treningów w tym dniu.</p>';
        } else {
            daysTrainings.forEach(t => {
                const item = document.createElement('div');
                item.className = `training-item ${t.user === 'Michał' ? 'item-michal' : 'item-klaudia'}`;
                item.innerHTML = `
                    <div class="training-info">
                        <h4 style="color: ${t.user === 'Michał' ? 'var(--michal-color)' : 'var(--klaudia-color)'}">${t.user}: ${t.type}</h4>
                        <p>Czas: <strong>${t.duration} min</strong></p>
                        ${t.distance ? `<p>Dystans: <strong>${t.distance} km</strong></p>` : ''}
                    </div>
                    <button class="btn-danger" style="padding: 5px 8px; font-size: 0.8rem;" onclick="deleteTraining('${t.id}')">Usuń</button>
                `;
                listContainer.appendChild(item);
            });
        }
    }

    document.getElementById('training-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const user = document.getElementById('input-user').value;
        const type = document.getElementById('input-type').value;
        const duration = parseInt(document.getElementById('input-duration').value);
        const distanceInput = document.getElementById('input-distance').value;
        const distance = distanceInput ? parseFloat(parseFloat(distanceInput).toFixed(2)) : null;
        const dateStr = formatDateLocal(selectedDate);

        if (!mainDatabase.trainings) mainDatabase.trainings = [];
        const newTraining = { id: Date.now().toString(), date: dateStr, user, type, duration, distance };
        mainDatabase.trainings.push(newTraining);

        if (type === "Bieganie (Bieżnia)") {
            mainDatabase.treadmillHours = parseFloat(((mainDatabase.treadmillHours || 0) + (duration / 60)).toFixed(2));
        }

        await saveData();
        
        document.getElementById('input-duration').value = '';
        document.getElementById('input-distance').value = '';
        
        renderCalendar();
        renderStats();
    });

    async function deleteTraining(id) {
        if(!confirm("Usunąć ten trening?")) return;
        const idx = mainDatabase.trainings.findIndex(t => t.id === id);
        if (idx !== -1) {
            const t = mainDatabase.trainings[idx];
            if (t.type === "Bieganie (Bieżnia)") {
                mainDatabase.treadmillHours = parseFloat(Math.max(0, (mainDatabase.treadmillHours || 0) - (t.duration / 60)).toFixed(2));
            }
            mainDatabase.trainings.splice(idx, 1);
            await saveData();
            renderCalendar();
            renderStats();
        }
    }

    document.getElementById('btn-reset-treadmill').addEventListener('click', async () => {
        if (confirm("Zresetować licznik oleju bieżni do 0h?")) {
            mainDatabase.treadmillHours = 0;
            await saveData();
            renderStats();
        }
    });

    function renderStats() {
        const trainings = mainDatabase.trainings || [];
        const mTrainings = trainings.filter(t => t.user === 'Michał');
        const kTrainings = trainings.filter(t => t.user === 'Klaudia');

        document.getElementById('michal-count').innerText = mTrainings.length;
        const mMinutes = mTrainings.reduce((sum, t) => sum + t.duration, 0);
        document.getElementById('michal-time').innerText = `${Math.round(mMinutes / 60)}h`;
        const mDist = mTrainings.reduce((sum, t) => sum + (t.distance || 0), 0);
        document.getElementById('michal-dist').innerText = `${mDist.toFixed(2)} km`;

        document.getElementById('klaudia-count').innerText = kTrainings.length;
        const kMinutes = kTrainings.reduce((sum, t) => sum + t.duration, 0);
        document.getElementById('klaudia-time').innerText = `${Math.round(kMinutes / 60)}h`;
        const kDist = kTrainings.reduce((sum, t) => sum + (t.distance || 0), 0);
        document.getElementById('klaudia-dist').innerText = `${kDist.toFixed(2)} km`;

        const curHours = mainDatabase.treadmillHours || 0;
        document.getElementById('treadmill-hours').innerText = `${curHours} / 30 h`;
        
        const statusEl = document.getElementById('treadmill-status');
        if (curHours >= 30) {
            statusEl.innerText = "⚠️ WYMAGANE SMAROWANIE PASA BIEŻNI!";
            statusEl.style.color = "#cf6679";
        } else if (curHours >= 25) {
            statusEl.innerText = "Niedługo należy przesmarować pas.";
            statusEl.style.color = "#ffb74d";
        } else {
            statusEl.innerText = "Stan oleju/smaru jest odpowiedni.";
            statusEl.style.color = "#03dac6";
        }
    }

    document.getElementById('btn-prev').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
    document.getElementById('btn-next').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });
    document.getElementById('btn-refresh').addEventListener('click', loadData);

    loadData();
    setInterval(loadData, 5000);
</script>
</body>
</html>
